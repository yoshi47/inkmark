version: 2

updates:
  # Grouped by dependency-type so a routine Monday is a couple of reviewable PRs
  # rather than a dozen. Majors are deliberately left out of update-types: they
  # need reading one at a time, so they arrive as individual PRs.
  # Grouping and schedule here govern version updates only — security updates
  # follow the repository's Dependabot security settings, not this file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
